services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo-keyfile"]
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      test: mongosh --quiet --eval "rs.status().ok"
      interval: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      - backend-storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      PROCESS_ROLE: worker
    command: node worker.js
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-storage:
