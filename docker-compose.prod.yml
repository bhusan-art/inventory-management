# Production stack.
#
# Differences from the development compose that matter:
#
#  - mongod runs with --auth and a keyfile. A replica set with authentication
#    REQUIRES a keyfile for the members to authenticate to each other, even
#    with a single member. Without it mongod refuses to start, which is better
#    than the alternative: --auth without --replSet starts happily and silently
#    disables every transaction in the system.
#  - No source bind mounts and no anonymous node_modules volume. The image is
#    the artefact; mounting over it is what made `multer` vanish in Phase 10.
#  - No published database port. Mongo is reachable only on the compose
#    network. Publishing 27017 puts the database on the internet, which is the
#    single most common way a system like this is lost.
#  - Hard resource limits, so one runaway report cannot take the host down.
#
# First-time setup is in docs/DEPLOYMENT.md and is not optional: the keyfile
# and the database user do not exist until you create them.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      # Used by the healthcheck below and by scripts/backup.sh and
      # scripts/restore.sh, which read them from inside the container rather
      # than taking a password on the command line — an argument is visible in
      # `ps` to every user on the host.
      MONGO_USER: ${MONGO_USER:-ims}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env beside this file}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ims}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      # Must be mode 0400 and owned by the mongo user (uid 999) or mongod
      # refuses it. docs/DEPLOYMENT.md has the one-liner.
      - ./docker/mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      # Authenticated, and it INITIATES the set on first boot the way the
      # development healthcheck does. The previous version ran
      # `rs.status().ok` unauthenticated, which fails under --auth — so the
      # service never became healthy and `depends_on` never released the
      # backend. A healthcheck that cannot pass is an outage with a tidy
      # explanation.
      test: >
        mongosh --quiet
        "mongodb://${MONGO_USER:-ims}:${MONGO_PASSWORD}@localhost:27017/admin"
        --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok
          }"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      # The ONLY mount. Uploaded documents must outlive the container.
      - backend-storage:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      PROCESS_ROLE: worker
    # Shares the storage volume: the worker writes generated exports there.
    volumes:
      - backend-storage:/app/storage
    command: node worker.js
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Built on the host with `npm run build` in ./frontend. There is no
      # frontend container: the output is static files and nginx serves them
      # directly. An EMPTY ./frontend/dist mounts cleanly and serves 404s, so
      # DEPLOYMENT.md checks for it before bringing the stack up.
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  backend-storage:
