# Edge configuration.
#
# TLS terminates HERE. That is not decoration: the refresh token is an HttpOnly
# cookie with Secure set, and a browser does not send a Secure cookie over
# plain http — so over http every session silently fails to refresh and users
# are signed out every fifteen minutes with nothing in the logs to explain it.
# src/config/env.js refuses to boot in production if CLIENT_URL is not https,
# and this file is the other half of that promise.
#
# The certificate files must exist before `docker compose up`, or nginx exits
# at startup. docs/DEPLOYMENT.md has the step.

# ---------------------------------------------------------------- http
server {
    listen 80;
    server_name _;

    # Left on http deliberately — an ACME challenge cannot be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- https
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Larger than MAX_UPLOAD_BYTES (10MB) with room for multipart overhead.
    # Below it, nginx rejects the upload with a bare 413 that never reaches
    # the API, so the audit trail has no record of the attempt.
    client_max_body_size 12M;

    # Sent on everything, including the API. HSTS belongs at the edge because
    # it is a statement about the ORIGIN, not about one response.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app sets `trust proxy 1`, so this is what rate limiting counts
        # and what the audit log records. Without it every request appears to
        # come from the nginx container and one abusive client would exhaust
        # the limit for everybody.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed CSV and XLSX exports run long. Buffering off so the client
        # starts receiving immediately rather than waiting on the whole file.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # No security headers added here on purpose. helmet already sets them
        # on API responses, and `add_header` would APPEND rather than replace —
        # two different X-Frame-Options values on one response, which browsers
        # resolve in their own ways and auditors flag.
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The built app is content-hashed, so these can be cached hard. index.html
    # must NOT be: it is what points at the current hashes, and a cached copy
    # pins returning users to a deleted bundle after a deploy.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
